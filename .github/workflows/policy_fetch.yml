name: Daily Policy Snapshot and Firebase Deploy

on:
  schedule:
    - cron: '10 0,4,8,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-snapshot-firebase
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect official policy evidence
        env:
          FIREBASE_PROJECT_ID: research-stock-c8cd9
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run fetch

      - name: Check static site files
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          projectId: research-stock-c8cd9
          channelId: live
