<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">政策雷达研究工作台</title>
  <desc id="desc">展示政策来源、发现雷达、候选股票核验和反证检查的研究工作台界面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbf9"/>
      <stop offset=".55" stop-color="#edf5f1"/>
      <stop offset="1" stop-color="#e8f0ea"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f8f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#1a392f" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="820" rx="36" fill="url(#bg)"/>
  <circle cx="1030" cy="130" r="92" fill="#d9e8f3"/>
  <circle cx="178" cy="680" r="118" fill="#e8ecd7"/>
  <g filter="url(#shadow)">
    <rect x="86" y="72" width="1028" height="668" rx="28" fill="url(#panel)" stroke="#d6e5df"/>
  </g>
  <rect x="124" y="112" width="952" height="64" rx="16" fill="#102c27"/>
  <circle cx="158" cy="144" r="9" fill="#64d0a6"/>
  <circle cx="186" cy="144" r="9" fill="#f0c66d"/>
  <circle cx="214" cy="144" r="9" fill="#7eb1e4"/>
  <text x="254" y="151" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#eff8f3">政策雷达 · A股核验工作台</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="124" y="210" width="290" height="196" rx="18" fill="#ffffff" stroke="#d6e5df"/>
    <text x="150" y="250" font-size="16" font-weight="800" fill="#0f4f42">今日事实层</text>
    <text x="150" y="286" font-size="46" font-weight="900" fill="#167c63">0</text>
    <text x="206" y="286" font-size="15" font-weight="700" fill="#64736e">当天A/B级原文</text>
    <rect x="150" y="326" width="208" height="12" rx="6" fill="#dce5e1"/>
    <rect x="150" y="352" width="170" height="12" rx="6" fill="#e9efe9"/>
    <text x="150" y="384" font-size="13" fill="#64736e">空白不是失败，代表不把旧信息伪装成今日政策。</text>
    <rect x="454" y="210" width="290" height="196" rx="18" fill="#ffffff" stroke="#d6e5df"/>
    <text x="480" y="250" font-size="16" font-weight="800" fill="#0f4f42">发现雷达</text>
    <path d="M500 352c48-76 112-108 196-96" fill="none" stroke="#376c9b" stroke-width="10" stroke-linecap="round"/>
    <path d="M500 352c42-30 84-42 126-36" fill="none" stroke="#167c63" stroke-width="10" stroke-linecap="round"/>
    <circle cx="500" cy="352" r="14" fill="#0f4f42"/>
    <circle cx="628" cy="316" r="9" fill="#f0c66d"/>
    <circle cx="696" cy="256" r="9" fill="#376c9b"/>
    <text x="480" y="384" font-size="13" fill="#64736e">热榜只做发现，必须回溯官网和公告。</text>
    <rect x="784" y="210" width="292" height="196" rx="18" fill="#ffffff" stroke="#d6e5df"/>
    <text x="810" y="250" font-size="16" font-weight="800" fill="#0f4f42">候选核验</text>
    <g font-size="13" font-weight="800">
      <rect x="810" y="276" width="96" height="34" rx="9" fill="#e1f2ec"/>
      <text x="829" y="298" fill="#0f765c">600030</text>
      <rect x="920" y="276" width="96" height="34" rx="9" fill="#e6f0fb"/>
      <text x="939" y="298" fill="#245f9d">000333</text>
      <rect x="810" y="326" width="96" height="34" rx="9" fill="#fff3d9"/>
      <text x="829" y="348" fill="#8b6116">601138</text>
      <rect x="920" y="326" width="96" height="34" rx="9" fill="#edf1ef"/>
      <text x="939" y="348" fill="#5d6763">601668</text>
    </g>
    <text x="810" y="384" font-size="13" fill="#64736e">候选不是结论，下一步查公告、订单、现金流。</text>
    <rect x="124" y="446" width="952" height="216" rx="18" fill="#ffffff" stroke="#d6e5df"/>
    <text x="150" y="486" font-size="16" font-weight="800" fill="#0f4f42">政策 → 产业 → 公司 → 反证</text>
    <g transform="translate(150 526)">
      <rect width="170" height="72" rx="14" fill="#e1f2ec"/>
      <text x="28" y="32" font-size="15" font-weight="900" fill="#0f765c">官网原文</text>
      <text x="28" y="54" font-size="12" fill="#31544a">级别 / 日期 / 工具</text>
      <path d="M188 36h60" stroke="#9abeb2" stroke-width="5" stroke-linecap="round"/>
      <path d="M238 24l18 12-18 12" fill="none" stroke="#9abeb2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(410 526)">
      <rect width="170" height="72" rx="14" fill="#e6f0fb"/>
      <text x="28" y="32" font-size="15" font-weight="900" fill="#245f9d">产业传导</text>
      <text x="28" y="54" font-size="12" fill="#31544a">资金 / 订单 / 场景</text>
      <path d="M188 36h60" stroke="#9abeb2" stroke-width="5" stroke-linecap="round"/>
      <path d="M238 24l18 12-18 12" fill="none" stroke="#9abeb2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(670 526)">
      <rect width="170" height="72" rx="14" fill="#fff3d9"/>
      <text x="28" y="32" font-size="15" font-weight="900" fill="#8b6116">公司核验</text>
      <text x="28" y="54" font-size="12" fill="#5b4a2a">公告 / 财报 / 现金流</text>
      <path d="M188 36h60" stroke="#9abeb2" stroke-width="5" stroke-linecap="round"/>
      <path d="M238 24l18 12-18 12" fill="none" stroke="#9abeb2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(930 526)">
      <rect width="118" height="72" rx="14" fill="#edf1ef"/>
      <text x="24" y="32" font-size="15" font-weight="900" fill="#5d6763">反证</text>
      <text x="24" y="54" font-size="12" fill="#5d6763">剔除噪声</text>
    </g>
  </g>
</svg>
